[project]
name = "projet10"
version = "0.1.0"
description = "Assistant RAG SportSee (NBA) : recherche FAISS + outil SQL, évaluation RAGAS, API FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Pipeline RAG et agent
    "faiss-cpu>=1.15.1",
    "numpy>=2.5.3",
    "mistralai>=3,<4",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[mistral]>=2.54.0",
    "langchain-text-splitters>=1.1.2",
    "logfire>=5.1.1",
    "python-dotenv>=1.2.3",
    # Outil SQL (génération few-shot + base)
    "langchain-core>=1.6.5",
    "langchain-mistralai>=1.1.6",
    "sqlalchemy>=2.1.1",
    # Chargement des données
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",          # moteur de pd.read_excel (non importé directement)
    # API
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",          # serveur, lancé en ligne de commande
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "httpx>=0.28.1",            # requis par fastapi.testclient
]
indexing = [                    # construction de l'index FAISS (OCR des PDF)
    "easyocr>=1.7.2",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]
eval = [                        # évaluation RAGAS
    "ragas>=0.4.3",
    "langchain-community<0.4",  # requis par ragas (borne : incompatibilité constatée à l'étape 1)
    "rich>=14.3.4",
]
interface = [                   # MistralChat.py, interface Streamlit du prototype
    "streamlit>=1.64.0",
]

[tool.uv]
default-groups = ["dev", "indexing", "eval"]
override-dependencies = ["scikit-network; sys_platform == 'never'"]  # dépendance de ragas, ne compile pas en 3.14